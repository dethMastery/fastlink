<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suphakit P. | Link Tree</title>

    <link rel="stylesheet" href="/src/css/main.css" />
    <link rel="shortcut icon" href="https://suphakit.net/favicon.png" type="image/x-icon">
  </head>
  <body>
    <div class="container">
      <div class="main-card top-start">
        <div class="profile-img">
          <div
            class="img"
            style="background: url(https://github.com/dethMastery.png)"
          ></div>
        </div>
        <div class="info-box">
          <h1>Suphakit P.</h1>
          <h3>knew as `Solomon*`, `Dethz`, `katsuragi.wav`</h3>
        </div>
      </div>

      <div class="text-box bot-start">
        <div class="nav"></div>
        <div class="links hidden">
          
        </div>
        <div class="spotify hidden">
          <div class="controller">
            <button class="button" id="spt-prev">
              ◀️
            </button>
            <div class="spotify-element"></div>
            <button class="button" id="spt-next">
              ▶️
            </button>
          </div>
          
        </div>
      </div>
    </div>

    <!-- Animation -->
    <script src="/src/js/animation.js"></script>

    <!-- Components -->
    <script src="/src/js/components/tabs.js"></script>
    <script src="/src/js/components/links.js"></script>
    <script src="/src/js/components/spotify.js"></script>
  </body>
</html>
